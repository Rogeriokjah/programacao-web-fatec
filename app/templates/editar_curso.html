{% extends "base.html" %}

{% block title %}Editar Curso{% endblock %}

{% block content %}
<h2>Editar Curso</h2>
<form id="cursoForm" method="POST" action="{{ url_for('editar_curso', id=curso.id) }}">
    {{ form.hidden_tag() }}
    <div>
        {{ form.nome.label }}
        <br>
        {{ form.nome(size=32, value=curso.nome) }}
    </div>
    <div>
        <label for="searchDisciplinas">Disciplinas</label>
        <input type="text" id="searchDisciplinas" placeholder="Digite para buscar disciplinas">
        <div id="disciplinasList"></div>
        <div id="disciplinasListSelected" class="selected-disciplinas-list">
            {% for disciplina in curso.disciplinas %}
                <div class="selected-disciplina">
                    {{ disciplina.nome }}
                    <span class="remove-disciplina" onclick="removeDisciplinaFromList({{ disciplina.id }})">✖</span>
                    <input type="hidden" name="disciplinas" value="{{ disciplina.id }}">
                </div>
            {% endfor %}
        </div>
    </div>
    <div>
        <button type="submit" class="button">Salvar Alterações</button>
        <a href="{{ url_for('cursos') }}" class="button button-secondary">Cancelar</a>
    </div>
</form>

<script>
    // Lógica de autocomplete com debounce para buscar disciplinas
    let timeout;
    const selectedDisciplinas = Array.from(document.querySelectorAll('input[name="disciplinas"]')).map(input => input.value);

    document.getElementById("searchDisciplinas").addEventListener("keyup", function() {
        clearTimeout(timeout);
        const query = this.value;
        
        if (query.length >= 2) {
            timeout = setTimeout(() => {
                fetch(`{{ url_for('buscar_disciplinas') }}?query=${query}&exclude=${selectedDisciplinas.join(",")}`)
                    .then(response => response.json())
                    .then(data => {
                        const disciplinasList = document.getElementById("disciplinasList");
                        disciplinasList.innerHTML = '';
                        data.forEach(disciplina => {
                            const item = document.createElement("div");
                            item.classList.add("disciplina-item");
                            item.textContent = disciplina.nome;
                            item.dataset.id = disciplina.id;
                            item.onclick = () => {
                                addDisciplinaToList(disciplina.id, disciplina.nome);
                            };
                            disciplinasList.appendChild(item);
                        });
                    });
            }, 1300); // Debounce de 1,3 segundos
        }
    });

    function addDisciplinaToList(id, nome) {
        const disciplinasField = document.getElementById("disciplinasListSelected");

        if (!selectedDisciplinas.includes(id.toString())) {
            const item = document.createElement("div");
            item.classList.add("selected-disciplina");
            item.textContent = nome;

            const removeButton = document.createElement("span");
            removeButton.classList.add("remove-disciplina");
            removeButton.textContent = "✖";
            removeButton.onclick = () => {
                item.remove();
                selectedDisciplinas.splice(selectedDisciplinas.indexOf(id.toString()), 1);
            };

            item.appendChild(removeButton);
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = "disciplinas";
            input.value = id;
            item.appendChild(input);
            disciplinasField.appendChild(item);

            selectedDisciplinas.push(id.toString());
        }
    }

    function removeDisciplinaFromList(id) {
        const index = selectedDisciplinas.indexOf(id.toString());
        if (index !== -1) {
            selectedDisciplinas.splice(index, 1);
            document.querySelector(`input[name="disciplinas"][value="${id}"]`).parentElement.remove();
        }
    }
</script>
{% endblock %}
